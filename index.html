
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lafzon Ka Safar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100f18;color:#f7eee5;font-family:Georgia,serif}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#24152e,#56304c)}
h1{font-size:34px;margin:0;color:#ffd59e}
header p{color:#e8c9d5}
main{max-width:850px;margin:auto;padding:20px}
h2{color:#ffd59e}
button{background:#b66a83;color:white;border:0;padding:11px 17px;border-radius:8px;cursor:pointer;margin:5px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border-radius:8px;border:1px solid #76536a;background:#211b29;color:white}
.poem{background:#211b29;border:1px solid #55394c;border-radius:12px;padding:18px;margin:15px 0;white-space:pre-wrap}
.poem h3{color:#ffd59e;margin-top:0}
.small{color:#c7aab9;font-size:13px}
#adminPanel{display:none;background:#211b29;padding:18px;border-radius:12px;margin-top:20px}
#loginPanel{background:#211b29;padding:18px;border-radius:12px;margin-top:20px}
footer{text-align:center;padding:30px;color:#c7aab9}
</style>
</head>
<body>
<div style="background:#211b29;padding:10px 20px;text-align:right;border-bottom:1px solid #76536a;">
  <button onclick="document.getElementById('loginPanel').scrollIntoView({behavior:'smooth'});">
    🔐 Admin Login
  </button>
</div>
  <header>
<h1>लफ़्ज़ों का सफ़र</h1>
<p>Raunac की कलम से ❤️</p>
<p>कुछ अल्फ़ाज़, कुछ एहसास... ❤️</p>
</header>
<main>
<h2>मेरी शायरियाँ</h2>
<input
  id="search"
  type="search"
  placeholder="🔍 अपनी पसंदीदा शायरी खोजें..."
  oninput="currentPage=1;loadPoems()"
>
 <select id="filter" onchange="currentPage=1;loadPoems()">
<option value="">सभी Categories</option>
<option>मोहब्बत</option>
<option>दर्द</option>
<option>ज़िंदगी</option>
<option>दोस्ती</option>
<option>अन्य</option>
</select>
<div id="poems">शायरियाँ लोड हो रही हैं...</div>
<div id="pagination" style="text-align:center;padding:20px;">
  <button onclick="changePage(-1)">⬅ पिछला पेज</button>
  <span id="pageInfo">पेज 1</span>
  <button onclick="changePage(1)">अगला पेज ➡</button>
</div>
<div id="loginPanel">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage" class="small"></p>
</div>

<div id="adminPanel">
<h2>नई शायरी जोड़ें</h2>
<input id="title" placeholder="शायरी का शीर्षक">
<select id="category">
<option>मोहब्बत</option>
<option>दर्द</option>
<option>ज़िंदगी</option>
<option>दोस्ती</option>
<option>अन्य</option>
</select>
<textarea id="body" rows="7" placeholder="अपनी शायरी यहाँ लिखें"></textarea>
<button onclick="addPoem()">शायरी सेव करें</button>
<button onclick="logout()">Logout</button>
<p id="adminMessage" class="small"></p>
</div>
</main>
<footer>लफ़्ज़ों का सफ़र — दिल से लिखे अल्फ़ाज़ ❤️</footer>

<script>
const SUPABASE_URL = "https://lsgplwnopqqjaelthoqu.supabase.co";
const SUPABASE_KEY = "sb_publishable_X95sFn59x6nZEiEVkMV92w_OaC4ey6v";
const ADMIN_EMAIL = "ronaksingh9358@gmail.com";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function el(id){return document.getElementById(id)}
let currentPage = 1;
const poemsPerPage = 10;

function changePage(direction) {
  currentPage += direction;
  loadPoems();
}
async function loadPoems(){

  const box=el("poems");
 box.textContent="शायरियाँ लोड हो रही हैं...";
 let query=db.from("poems").select("*").order("created_at",{ascending:false});
 const category=el("filter").value;
 if(category) query=query.eq("category",category);
 const {data,error}=await query;
 box.replaceChildren();
 if(error){box.textContent="शायरियाँ लोड नहीं हुईं: "+error.message;return}
const searchTerm = el("search").value.trim().toLowerCase();

const filteredData = data.filter(poem =>
  (poem.title || "").toLowerCase().includes(searchTerm) ||
  (poem.body || "").toLowerCase().includes(searchTerm)
);
if(!filteredData.length){
  box.textContent = searchTerm
    ? "इस शब्द से कोई शायरी नहीं मिली।"
    : "अभी कोई शायरी नहीं है।";
  return;
}
const totalPages = Math.max(1, Math.ceil(filteredData.length / poemsPerPage));

if (currentPage > totalPages) currentPage = totalPages;

const startIndex = (currentPage - 1) * poemsPerPage;
const pageData = filteredData.slice(startIndex, startIndex + poemsPerPage);

el("pageInfo").textContent = `पेज ${currentPage} / ${totalPages}`;

const pagination = el("pagination");
pagination.children[0].disabled = currentPage === 1;
pagination.children[2].disabled = currentPage === totalPages;
  const {data:sessionData}=await db.auth.getSession();
 const isAdmin=sessionData.session?.user?.email===ADMIN_EMAIL;
 pageData.forEach(poem=>{
  const card=document.createElement("div");
  card.className="poem";
  const heading=document.createElement("h3");
  heading.textContent=poem.title;
  const categoryText=document.createElement("p");
  categoryText.className="small";
  categoryText.textContent=poem.category||"";
  const words=document.createElement("p");
  words.textContent=poem.body;
const shareBtn = document.createElement("button");
shareBtn.textContent = "📲 WhatsApp पर Share करें";
shareBtn.onclick = () => {
  const message = poem.title + "\n\n" + poem.body;
  const url = "https://wa.me/?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
};
card.append(shareBtn);
  card.append(heading,categoryText,words);
  if(isAdmin){
   const del=document.createElement("button");
   del.textContent="शायरी हटाएँ";
   del.onclick=()=>deletePoem(poem.id);
   card.append(del);
  }
  box.append(card);
 });
}

async function login(){
 const email=el("email").value.trim();
 const password=el("password").value;
 el("loginMessage").textContent="Login हो रहा है...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){el("loginMessage").textContent=error.message;return}
 if(data.user.email!==ADMIN_EMAIL){
  await db.auth.signOut();
  el("loginMessage").textContent="यह Admin Email नहीं है।";
  return;
 }
 el("loginMessage").textContent="Login सफल हुआ!";
 updateAdmin();
}

async function logout(){
 await db.auth.signOut();
 updateAdmin();
 loadPoems();
}

async function updateAdmin(){
 const {data}=await db.auth.getSession();
 const isAdmin=data.session?.user?.email===ADMIN_EMAIL;
 el("adminPanel").style.display=isAdmin?"block":"none";
 el("loginPanel").style.display=isAdmin?"none":"block";
 loadPoems();
}

async function addPoem(){
 const title=el("title").value.trim();
 const category=el("category").value;
 const body=el("body").value.trim();
 if(!title||!body){el("adminMessage").textContent="शीर्षक और शायरी लिखें।";return}
 el("adminMessage").textContent="सेव हो रहा है...";
 const {error}=await db.from("poems").insert([{title,category,body}]);
 if(error){el("adminMessage").textContent="त्रुटि: "+error.message;return}
 el("adminMessage").textContent="शायरी सफलतापूर्वक सेव हो गई!";
 el("title").value="";
 el("body").value="";
 loadPoems();
}

async function deletePoem(id){
 if(!confirm("क्या यह शायरी हटानी है?"))return;
 const {error}=await db.from("poems").delete().eq("id",id);
 if(error){alert("हटाने में समस्या: "+error.message);return}
 loadPoems();
}

db.auth.onAuthStateChange(()=>updateAdmin());
updateAdmin();
</script>
</body>
</html>
